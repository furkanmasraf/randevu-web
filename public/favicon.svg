<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Dark luxury background -->
  <rect width="512" height="512" rx="140" fill="#1E1B18" />
  <!-- Scissors -->
  <g transform="translate(256, 256) rotate(-45) translate(-150, -130)" stroke="#C5A880" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Pivot pin -->
    <circle cx="150" cy="130" r="8" fill="#C5A880" />
    <!-- Loops -->
    <circle cx="65" cy="80" r="28" stroke-width="22" />
    <circle cx="65" cy="180" r="28" stroke-width="22" />
    <!-- Cross lines (blades) -->
    <path d="M 85 95 L 240 160" stroke-width="20" />
    <path d="M 85 165 L 240 100" stroke-width="20" />
  </g>
</svg>